[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryojax-match-template"
version = "0.1.0"
description = "cisTEM-style 2D template matching with cryojax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "jax", "cryojax", "mrcfile"]

[project.scripts]
cryojax-match-template = "cryojax_match_template.cli:main"

[tool.setuptools]
packages = ["cryojax_match_template"]
